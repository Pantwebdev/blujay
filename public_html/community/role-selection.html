<body class="min-h-screen flex items-center justify-center px-4 py-8">
    
    <div class="max-w-2xl w-full bg-white border border-gray-200 rounded-lg shadow-sm p-8 lg:p-12">
        <!-- Header -->
        <div class="text-center mb-8">
            <a href="../index.html" class="inline-block mb-6">
                <img fetchpriority="high" height="400" width="600" src="../logo.png" alt="Blujay Tech" class="h-10 mx-auto">
            </a>
            <h1 class="text-2xl font-semibold text-gray-900 mb-2">
                Complete Your Profile
            </h1>
            <p class="text-sm text-gray-600">You've selected: <strong id="roleDisplay"></strong></p>
        </div>

        <!-- Role Confirmation -->
        <div id="roleCard" class="bg-blue-50 border border-blue-100 rounded-lg p-6 mb-6">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center flex-shrink-0">
                    <i id="roleIcon" class="fas text-xl text-blue-600"></i>
                </div>
                <div>
                    <h2 class="text-lg font-semibold text-gray-900 mb-1" id="roleTitle"></h2>
                    <p id="roleDescription" class="text-sm text-gray-600"></p>
                </div>
            </div>
        </div>

        <!-- Message -->
        <div class="bg-blue-50 border-l-4 border-blue-600 p-4 mb-6 rounded">
            <div class="flex items-start space-x-3">
                <i class="fas fa-info-circle text-blue-600 text-sm mt-0.5"></i>
                <div class="text-sm text-gray-700">
                    <p class="font-medium mb-1">Next Step: Create Your Profile</p>
                    <p>Click continue to fill out your detailed profile. Once submitted, our admin will review and verify your information.</p>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3">
            <button id="continueBtn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-md font-medium text-sm transition flex items-center justify-center space-x-2">
                <span>Continue to Profile Form</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
            
            <a href="index.html" 
                class="block w-full text-center border border-gray-300 text-gray-700 py-3 rounded-md font-medium text-sm hover:bg-gray-50 transition">
                <i class="fas fa-arrow-left text-xs"></i> Go Back
            </a>
        </div>

        <!-- User Info -->
        <div id="userInfo" class="mt-6 pt-6 border-t border-gray-200">
            <p class="text-xs text-gray-600">Logged in as: <strong id="userEmail"></strong></p>
        </div>
    </div>

    <script>
        // Get role from sessionStorage (set by the index page when user clicks Join button)
        const requestedProfile = sessionStorage.getItem('requestedProfile');
        const role = requestedProfile === 'GIVER' ? 'giver' : 'receiver';
        
        console.log('ðŸŽ­ Role Selection Page');
        console.log('   "¢ requestedProfile:', requestedProfile);
        console.log('   "¢ role:', role);
        
        // Role configurations
        const roleConfig = {
            receiver: {
                display: 'Job Support Seeker',
                icon: 'fa-user-graduate',
                title: 'Welcome, Job Support Seeker!',
                description: 'You\'ll be able to connect with recruiters and hiring managers to accelerate your career.',
                nextPage: 'receiver-profile.html?mode=create'
            },
            giver: {
                display: 'Helper',
                icon: 'fa-hands-helping',
                title: 'Welcome, Helper!',
                description: 'You\'ll help job support seekers by providing opportunities, guidance, and professional connections.',
                nextPage: 'giver-profile.html?mode=create'
            }
        };
        
        const config = roleConfig[role];
        
        // Update UI
        document.getElementById('roleDisplay').textContent = config.display;
        document.getElementById('roleIcon').className = 'fas ' + config.icon + ' text-xl text-blue-600';
        document.getElementById('roleTitle').textContent = config.title;
        document.getElementById('roleDescription').textContent = config.description;
        
        // Firebase Config - Use correct Blujay Tech config
        const firebaseConfig = {
            apiKey: "AIzaSyCiedANEie5u-2XQOjdsUFgdkE7s08gArY",
            authDomain: "blujay-tech.firebaseapp.com",
            projectId: "blujay-tech",
            storageBucket: "blujay-tech.firebasestorage.app",
            messagingSenderId: "586422050005",
            appId: "1:586422050005:web:737ba2502d1b283ea6165c",
            measurementId: "G-1JE665W8D0"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        // Check authentication
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('userEmail').textContent = user.email;
            } else {
                // Redirect to login if not authenticated
                showToast('Please login first to access the community portal', 'warning', 3000);
                setTimeout(() => {
                    window.location.href = '../login.html';
                }, 1500);
            }
        });
        
        // Continue button
        document.getElementById('continueBtn').addEventListener('click', () => {
            window.location.href = config.nextPage;
        });
    </script>

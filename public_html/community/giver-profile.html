<!DOCTYPE html>
<html lang="en">

    
<head>
    <meta charset="UTF-8">
    <link rel="canonical" href="https://www.blujaytech.com/community\giver-profile.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Profile - Professional Helper | Blujay Tech Community</title>
    
    <!-- Toast Notifications -->
    <script src="toast-notifications.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f8f9fa; min-height: 100vh; }
        .form-input {
            transition: border-color 0.2s ease;
            border: 1px solid #e2e8f0;
        }
        .form-input:focus {
            border-color: #0b5ed7;
            box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.1);
            outline: none;
        }
        .btn-primary {
            background: #0b5ed7;
            transition: background-color 0.2s ease;
        }
        .btn-primary:hover {
            background: #084298;
        }
        .skill-chip {
            transition: all 0.2s ease;
        }
        .skill-chip:hover {
            opacity: 0.8;
        }
    </style>
    <link rel="stylesheet" href="../css/responsive-global.css">
</head>
<body>
    
    <div class="min-h-screen py-8 px-4">
        <div class="max-w-3xl mx-auto">
            
            <!-- Header -->
            <div class="bg-white border border-gray-200 rounded-lg p-6 mb-6">
                <div class="flex items-center space-x-4 mb-3">
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-hands-helping text-xl text-purple-600"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-semibold text-gray-900">
                            Create Your Profile
                        </h1>
                        <p class="text-sm text-gray-600">
                            Join as a Professional Helper
                        </p>
                    </div>
                </div>
            </div>
            
            <!-- Form Card -->
            <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6 md:p-8">
                
                <form id="contact-form" id="profileForm" class="space-y-5">
                    
                    <!-- Full Name -->
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1.5">
                            Full Name *
                        </label>
                        <input type="text" id="fullName" required
                            class="form-input w-full px-3 py-2.5 rounded-md text-sm"
                            placeholder="Enter your full name">
                    </div>
                    
                    <!-- Email -->
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1.5">
                            Email Address *
                        </label>
                        <input type="email" id="email" required readonly
                            class="form-input w-full px-3 py-2.5 rounded-md bg-gray-50 cursor-not-allowed text-sm"
                            placeholder="Your email">
                        <p class="text-xs text-gray-500 mt-1">Email is auto-filled from your account</p>
                    </div>
                    
                    <!-- Mobile Number -->
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1.5">
                            Mobile Number *
                        </label>
                        <input type="tel" id="mobileNumber" required
                            class="form-input w-full px-3 py-2.5 rounded-md text-sm"
                            placeholder="9876543210"
                            pattern="[0-9]{10}"
                            maxlength="10">
                        <p class="text-xs text-gray-500 mt-1">Enter 10-digit mobile number without country code</p>
                    </div>
                    
                    <!-- Location -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-map-marker-alt text-purple-600 mr-2"></i>Location *
                        </label>
                        <input type="text" id="location" required
                            class="form-input w-full px-4 py-3 rounded-lg"
                            placeholder="City, State, Country">
                    </div>
                    
                    <!-- Company -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-building text-purple-600 mr-2"></i>Current Company
                        </label>
                        <input type="text" id="company"
                            class="form-input w-full px-4 py-3 rounded-lg"
                            placeholder="Company name">
                    </div>
                    
                    <!-- Job Title -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-id-badge text-purple-600 mr-2"></i>Job Title *
                        </label>
                        <input type="text" id="jobTitle" required
                            class="form-input w-full px-4 py-3 rounded-lg"
                            placeholder="e.g., Senior Software Engineer, HR Manager">
                    </div>
                    
                    <!-- Skills -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-code text-purple-600 mr-2"></i>Skills & Expertise *
                        </label>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="skillInput"
                                class="form-input flex-1 px-4 py-3 rounded-lg"
                                placeholder="Type a skill and press Enter">
                            <button type="button" onclick="addSkill()" 
                                class="px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                                Add
                            </button>
                        </div>
                        <div id="skillsList" class="flex flex-wrap gap-2 min-h-[40px]">
                            <!-- Skills will appear here -->
                        </div>
                        <input type="hidden" id="skills" required>
                    </div>
                    
                    <!-- Experience -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-briefcase text-purple-600 mr-2"></i>Total Experience *
                        </label>
                        <select id="experience" required
                            class="form-input w-full px-4 py-3 rounded-lg">
                            <option value="">Select experience level</option>
                            <option value="1-3 years">1-3 years</option>
                            <option value="3-5 years">3-5 years</option>
                            <option value="5-10 years">5-10 years</option>
                            <option value="10+ years">10+ years</option>
                        </select>
                    </div>
                    
                    <!-- Availability -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-clock text-purple-600 mr-2"></i>Availability *
                        </label>
                        <select id="availability" required
                            class="form-input w-full px-4 py-3 rounded-lg">
                            <option value="">Select availability</option>
                            <option value="Weekends">Weekends Only</option>
                            <option value="Weekdays Evenings">Weekdays Evenings</option>
                            <option value="Flexible">Flexible</option>
                            <option value="Limited">Limited (on request)</option>
                        </select>
                    </div>
                    
                    <!-- LinkedIn -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fab fa-linkedin text-purple-600 mr-2"></i>LinkedIn Profile *
                        </label>
                        <input type="url" id="linkedIn" required
                            class="form-input w-full px-4 py-3 rounded-lg"
                            placeholder="https://linkedin.com/in/yourprofile">
                    </div>
                    
                    <!-- About -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2 flex items-center justify-between">
                            <span><i class="fas fa-align-left text-purple-600 mr-2"></i>About You (Optional)</span>
                            <span id="bioCounter" class="text-gray-400 text-xs font-normal">0 characters</span>
                        </label>
                        <textarea id="about" rows="4"
                            class="form-input w-full px-4 py-3 rounded-lg"
                            placeholder="Tell us about your experience, expertise, and how you can help job support seekers..."></textarea>
                        <p class="text-xs text-gray-500 mt-1">Optional field - share as much as you like</p>
                    </div>
                    
                    <!-- Submit Button -->
                    <div class="pt-4">
                        <button type="submit" id="submitBtn"
                            class="btn-primary w-full text-white font-semibold py-4 rounded-lg shadow-lg flex items-center justify-center gap-2">
                            <i class="fas fa-check-circle"></i>
                            <span>Create Profile & Continue</span>
                        </button>
                    </div>
                    
                </form>
                
                <!-- Back Link -->
                <div class="text-center mt-6">
                    <a href="role-selection.html" class="text-gray-600 hover:text-purple-600 transition inline-flex items-center gap-2">
                        <i class="fas fa-arrow-left"></i>
                        <span>Back to Role Selection</span>
                    </a>
                </div>
                
            </div>
            
        </div>
    </div>
    
    <!-- Firebase & Scripts -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        
        // Use the correct Blujay Tech Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCiedANEie5u-2XQOjdsUFgdkE7s08gArY",
            authDomain: "blujay-tech.firebaseapp.com",
            projectId: "blujay-tech",
            storageBucket: "blujay-tech.firebasestorage.app",
            messagingSenderId: "586422050005",
            appId: "1:586422050005:web:737ba2502d1b283ea6165c",
            measurementId: "G-1JE665W8D0"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Detect mode: create or edit
        let skillsArray = [];
        let currentUser = null;
        
        // Define skills functions IMMEDIATELY so they're available for onclick
        window.addSkill = function() {
            console.log('🔧 addSkill called');
            const input = document.getElementById('skillInput');
            if (!input) {
                console.error('❌ skillInput element not found');
                return;
            }
            
            const skill = input.value.trim();
            console.log('📝 Skill entered:', skill);
            
            if (!skill) {
                showFieldError('skillInput', 'Please enter a skill');
                return;
            }
            
            if (skillsArray.includes(skill)) {
                showFieldError('skillInput', 'This skill is already added');
                return;
            }
            
            skillsArray.push(skill);
            console.log('✅ Skills array:', skillsArray);
            renderSkills();
            input.value = '';
            input.focus();
        };
        
        window.removeSkill = function(index) {
            console.log('🗑️ Removing skill at index:', index);
            skillsArray.splice(index, 1);
            renderSkills();
        };
        
        console.log('✅ Skills functions defined globally');
        
        console.log('🏗️ Giver Profile - Starting...');
        
        // SECURITY: Check if user came through proper flow
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'create';
        const isEditMode = mode === 'edit';
        const requestedProfile = sessionStorage.getItem('requestedProfile');
        
        console.log(`📋 Mode: ${mode.toUpperCase()}`);
        
        if (mode === 'create' && requestedProfile !== 'GIVER') {
            console.warn('⚠️ SECURITY: Direct URL access detected without proper role selection');
            console.log('🔄 Redirecting to role selection...');
            showToast('Please select your role first', 'warning', 3000);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
            throw new Error('Invalid access');
        }
        
        // SECURITY: Input sanitization helper
        function sanitizeInput(input) {
            if (!input) return '';
            const div = document.createElement('div');
            div.textContent = input;
            return div.innerHTML;
        }
        
        // SECURITY: Validate and sanitize form data
        function validateAndSanitize(data) {
            return {
                ...data,
                fullName: sanitizeInput(data.fullName?.trim()),
                email: sanitizeInput(data.email?.trim()),
                mobileNumber: sanitizeInput(data.mobileNumber?.trim()),
                location: sanitizeInput(data.location?.trim()),
                companyName: sanitizeInput(data.companyName?.trim()),
                currentRole: sanitizeInput(data.currentRole?.trim()),
                linkedinProfile: sanitizeInput(data.linkedinProfile?.trim()),
                bio: sanitizeInput(data.bio?.trim()),
                skills: data.skills?.map(s => sanitizeInput(s?.trim()))
            };
        }
        
        // Set persistence FIRST before any auth checks
        setPersistence(auth, browserLocalPersistence).then(() => {
            console.log('✅ Auth persistence set to LOCAL');
            
            // Check auth
            onAuthStateChanged(auth, async (user) => {
                console.log('🔔 Auth state changed:', user ? user.email : 'No user');
                
                if (!user) {
                    console.log('❌ No user authenticated, redirecting...');
                    window.location.href = '../login.html?redirect=community';
                    return;
                }
                
                currentUser = user;
                document.getElementById('email').value = user.email;
                console.log('✅ User authenticated:', user.email);
                
                // Check if profile exists
                try {
                    const token = await user.getIdToken();
                    const API_URL = window.API_CONFIG?.getApiUrl() || 'http://localhost:5000/api';
                    console.log('📡 Fetching profile from:', `${API_URL}/community/my-profile`);
                    
                    const response = await fetch(`${API_URL}/community/my-profile`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        console.log('✅ Profile data:', data);
                        if (data.profile) {
                            // Profile exists, populate form
                            console.log('📝 Populating form with existing profile');
                            populateForm(data.profile);
                        } else {
                            console.log('ℹ️ No existing profile, ready to create new one');
                        }
                    } else {
                        console.log('ℹ️ No existing profile found');
                    }
                } catch (error) {
                    console.log('ℹ️ No existing profile:', error.message);
                }                
                // Update button text based on mode
                // Update button text based on mode
                const submitBtn = document.getElementById('submitBtn');
                if (isEditMode) {
                    submitBtn.innerHTML = '<i class="fas fa-save"></i><span>Save Changes</span>';
                    document.querySelector('h1').textContent = 'Edit Your Profile';
                }
            });
        }).catch((error) => {
            console.error('❌ Error setting persistence:', error);
        });
        
        function populateForm(profile) {
            console.log('📋 Populating form with profile data:', profile);
            
            document.getElementById('fullName').value = profile.fullName || '';
            document.getElementById('mobileNumber').value = profile.mobileNumber || '';
            document.getElementById('location').value = profile.location || '';
            document.getElementById('company').value = profile.companyName || profile.company || '';
            document.getElementById('jobTitle').value = profile.currentRole || profile.jobTitle || '';
            document.getElementById('experience').value = profile.experienceYears ? `${profile.experienceYears} years` : (profile.experience || '');
            document.getElementById('availability').value = profile.industry || profile.availability || '';
            document.getElementById('linkedIn').value = profile.linkedinProfile || profile.linkedIn || '';
            document.getElementById('about').value = profile.bio || profile.about || '';
            
            if (profile.skills && profile.skills.length > 0) {
                skillsArray = [...profile.skills]; // Clone array
                console.log('✅ Loaded skills:', skillsArray);
                renderSkills();
            }
            
            console.log('✅ Form populated successfully');
        }
        
        // renderSkills function
        function renderSkills() {
            console.log('🎨 renderSkills called, skills:', skillsArray);
            const container = document.getElementById('skillsList');
            if (!container) {
                console.error('❌ skillsList container not found');
                return;
            }
            
            if (skillsArray.length === 0) {
                container.innerHTML = '<span class="text-gray-400 text-sm">No skills added yet</span>';
                document.getElementById('skills').value = '';
                return;
            }
            
            container.innerHTML = skillsArray.map((skill, index) => `
                <span class="skill-chip inline-flex items-center gap-2 px-4 py-2 bg-purple-100 text-purple-800 rounded-full text-sm font-medium">
                    ${escapeHtml(skill)}
                    <button type="button" onclick="removeSkill(${index})" 
                        class="hover:text-red-600 transition">
                        <i class="fas fa-times"></i>
                    </button>
                </span>
            `).join('');
            
            document.getElementById('skills').value = JSON.stringify(skillsArray);
            console.log('✅ Skills rendered:', skillsArray.length, 'skills');
        }
        
        // Helper function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Bio character counter
        function updateBioCounter() {
            const bioField = document.getElementById('about');
            const counter = document.getElementById('bioCounter');
            if (bioField && counter) {
                const length = bioField.value.length;
                counter.textContent = `${length} characters`;
                counter.classList.remove('text-red-500', 'text-green-600');
                counter.classList.add('text-gray-400');
            }
        }
        
        // Enter key for skills - wait for DOM
        setTimeout(() => {
            const skillInput = document.getElementById('skillInput');
            if (skillInput) {
                skillInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        window.addSkill();
                    }
                });
                console.log('✅ Skills input event listener attached');
            } else {
                console.error('❌ skillInput not found');
            }
            
            // Attach bio counter
            const bioField = document.getElementById('about');
            if (bioField) {
                bioField.addEventListener('input', updateBioCounter);
                updateBioCounter(); // Initial update
                console.log('✅ Bio counter attached');
            }
        }, 100);
        
        // Form submission
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (skillsArray.length === 0) {
                showToast('Please add at least one skill', 'error', 3000);
                document.getElementById('skillInput').focus();
                return;
            }
            
            // Validate mobile number (exactly 10 digits)
            const mobileNumber = document.getElementById('mobileNumber').value.trim();
            if (!/^[0-9]{10}$/.test(mobileNumber)) {
                showToast('Please enter a valid 10-digit mobile number', 'error', 3000);
                document.getElementById('mobileNumber').focus();
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Creating Profile...';
            
            try {
                const token = await currentUser.getIdToken();
                
                // Prepare profile data
                const profileData = {
                    profileType: 'GIVER',
                    fullName: document.getElementById('fullName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    mobileNumber: document.getElementById('mobileNumber').value.trim(),
                    location: document.getElementById('location').value.trim(),
                    companyName: document.getElementById('company').value.trim() || '',
                    currentRole: document.getElementById('jobTitle').value.trim(),
                    skills: skillsArray,
                    experienceYears: document.getElementById('experience').value,
                    industry: document.getElementById('availability').value,
                    linkedinProfile: document.getElementById('linkedIn').value.trim(),
                    bio: document.getElementById('about').value.trim() || ''
                };
                
                console.log('📤 Profile data to send:', profileData);
                
                const API_URL = window.API_CONFIG?.getApiUrl() || 'http://localhost:5000/api';
                const response = await fetch(`${API_URL}/community/profile`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(profileData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Clear any stored session data
                    sessionStorage.removeItem('requestedProfile');
                    sessionStorage.removeItem('loginContext');
                    
                    console.log('✅ Profile saved successfully!');
                    
                    showToast('Profile created successfully! Awaiting admin verification...', 'success', 3000);
                    setTimeout(() => {
                        window.location.href = 'verification-pending.html?role=giver';
                    }, 2000);
                } else {
                    console.error('❌ Server error:', data);
                    
                    // Handle specific error types
                    if (response.status === 429) {
                        showToast('Too many attempts. Please wait 5 minutes before trying again.', 'error', 5000);
                    } else if (response.status === 400 && data.message) {
                        showToast('Validation Error: ' + data.message, 'error', 5000);
                    } else {
                        showToast('Error: ' + (data.message || 'Failed to create profile'), 'error', 5000);
                    }
                    
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-check-circle"></i><span>Create Profile & Continue</span>';
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Error: ' + error.message, 'error', 5000);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i><span>Create Profile & Continue</span>';
            }
        });
    </script>

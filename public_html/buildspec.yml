version: 0.2

env:
  variables:
    ECR_ACCOUNT_ID: "707604458390"
    IMAGE_REPO_NAME: blujaytech
    CONTAINER_NAME: website

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - if [ "${ACCOUNT_ID}" != "${ECR_ACCOUNT_ID}" ]; then echo "Authenticated AWS account does not match ECR_ACCOUNT_ID"; exit 1; fi
      - REPOSITORY_URI=${ECR_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - IMAGE_URI=${REPOSITORY_URI}:${IMAGE_TAG}
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${REPOSITORY_URI%%/*}
  build:
    commands:
      - if [ -f Dockerfile ]; then BUILD_CONTEXT=.; elif [ -f public_html/Dockerfile ]; then BUILD_CONTEXT=public_html; else echo "Dockerfile not found in the source root or public_html/"; exit 1; fi
      - docker build -t ${IMAGE_URI} ${BUILD_CONTEXT}
      - docker push ${IMAGE_URI}
  post_build:
    commands:
      - printf '[{"name":"%s","imageUri":"%s"}]' "${CONTAINER_NAME}" "${IMAGE_URI}" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json